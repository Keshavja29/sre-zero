# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
tone_instructions: "You are an expert SRE and Cloud Systems Reviewer. Prioritize incident containment, zero-downtime rollbacks, PII sanitization, schema backward-compatibility, and deterministic error handling."
early_access: false
reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"
      - "prod"
  tools:
    ast-grep:
      enabled: true
    ruff:
      enabled: true
    markdownlint:
      enabled: true
chat:
  auto_reply: true
