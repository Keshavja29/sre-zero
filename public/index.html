    // ─── 5 DISTINCT REAL MICROSERVICE BUGS DATABASE ───
    const INITIAL_ERRORS = [
      {
        id: 'err-1',
        service: 'payment-service',
        file: 'services/payment/checkout_handler.py',
        line: 142,
        title: "KeyError: 'currency_code'",
        category: 'HTTP 500 Outage',
        severity: 'P0 Critical',
        cause: "Frontend v2.1 client payload omitted 'currency_code'. Direct dict access threw unhandled KeyError.",
        badLine: "currency = payload['currency_code']",
        goodLine: "currency = payload.get('currency_code', 'INR')",
        beforeCode: `140  def process_payment(order_id, payload):
141      amount = payload.get('amount', 0)
142 -    currency = payload['currency_code']   # ❌ CRASH: KeyError on legacy client
143      return gateway.charge(amount=amount, currency=currency)`,
        afterCode: `140  def process_payment(order_id, payload):
141      amount = payload.get('amount', 0)
142 +    currency = payload.get('currency_code', 'INR')  # ✅ RESOLVED: Safe fallback default
143      return gateway.charge(amount=amount, currency=currency)`,
        resolved: false
      },
      {
        id: 'err-2',
        service: 'auth-service',
        file: 'services/auth/jwt_validator.py',
        line: 88,
        title: "AttributeError: 'NoneType' has no attribute 'split'",
        category: 'HTTP 401/500 Crash',
        severity: 'P0 Critical',
        cause: "Client requested API without Authorization header. Direct string split threw NoneType exception.",
        badLine: "token = auth_header.split(' ')[1]",
        goodLine: "token = auth_header.split(' ')[1] if (auth_header and ' ' in auth_header) else ''",
        beforeCode: `86  def extract_bearer_token(request_headers):
87      auth_header = request_headers.get('Authorization')
88 -    token = auth_header.split(" ")[1]   # ❌ CRASH: AttributeError if header missing
89      return jwt.decode(token, SECRET_KEY, algorithms=["HS256"])`,
        afterCode: `86  def extract_bearer_token(request_headers):
87      auth_header = request_headers.get('Authorization')
88 +    token = auth_header.split(" ")[1] if (auth_header and " " in auth_header) else ""  # ✅ RESOLVED
89      return jwt.decode(token, SECRET_KEY, algorithms=["HS256"]) if token else None`,
        resolved: false
      },
      {
        id: 'err-3',
        service: 'cart-service',
        file: 'services/cart/redis_session.py',
        line: 64,
        title: "ConnectionResetError: Connection pool exhausted",
        category: 'High Latency Spike',
        severity: 'P1 High',
        cause: "Redis pool max_connections capped at 10. Heavy traffic spike caused 1,420ms connection backlog.",
        badLine: "pool = ConnectionPool(host='redis-cluster', max_connections=10)",
        goodLine: "pool = ConnectionPool(host='redis-cluster', max_connections=250, socket_timeout=2.0)",
        beforeCode: `62  def get_redis_client():
63      # Legacy pool setting insufficient for 120k lines/s
64 -    pool = ConnectionPool(host='redis-cluster', max_connections=10)   # ❌ BOTTLENECK
65      return redis.Redis(connection_pool=pool)`,
        afterCode: `62  def get_redis_client():
63      # Upgraded pool with non-blocking socket timeout
64 +    pool = ConnectionPool(host='redis-cluster', max_connections=250, socket_timeout=2.0) # ✅ RESOLVED
65      return redis.Redis(connection_pool=pool)`,
        resolved: false
      },
      {
        id: 'err-4',
        service: 'order-service',
        file: 'services/orders/database_pool.py',
        line: 115,
        title: "ZeroDivisionError: division by zero",
        category: 'Data Calculation Bug',
        severity: 'P1 High',
        cause: "Order count was 0 for empty test carts, resulting in unhandled division by zero.",
        badLine: "discount_rate = total_discount / order_count",
        goodLine: "discount_rate = (total_discount / order_count) if order_count > 0 else 0.0",
        beforeCode: `113  def calculate_average_discount(total_discount, order_count):
114      # Calculation assumes order_count is always > 0
115 -    discount_rate = total_discount / order_count   # ❌ CRASH: ZeroDivisionError
116      return round(discount_rate, 2)`,
        afterCode: `113  def calculate_average_discount(total_discount, order_count):
114      # Guard check prevents crash on empty checkout state
115 +    discount_rate = (total_discount / order_count) if order_count > 0 else 0.0 # ✅ RESOLVED
116      return round(discount_rate, 2)`,
        resolved: false
      },
      {
        id: 'err-5',
        service: 'notification-service',
        file: 'services/notification/webhook_dispatcher.py',
        line: 53,
        title: "TimeoutError: Synchronous 30s Gateway Timeout",
        category: 'Ingress Block',
        severity: 'P2 Medium',
        cause: "Synchronous webhook call blocked the main event loop for 30 seconds when partner endpoint lagged.",
        badLine: "resp = requests.post(webhook_url, json=event_data, timeout=30.0)",
        goodLine: "task = async_webhook_queue.delay(webhook_url, event_data, timeout=3.0)",
        beforeCode: `51  def dispatch_partner_webhook(webhook_url, event_data):
52      # Blocking synchronous call locks GKE thread
53 -    resp = requests.post(webhook_url, json=event_data, timeout=30.0) # ❌ THREAD LOCK
54      return resp.status_code`,
        afterCode: `51  def dispatch_partner_webhook(webhook_url, event_data):
52      # Dispatched asynchronously to background Celery queue
53 +    task = async_webhook_queue.delay(webhook_url, event_data, timeout=3.0) # ✅ RESOLVED
54      return 202`,
        resolved: false
      }
    ];

    function App() {
      // ─── 1. CORE TIMER & STOPWATCH (STARTS AT 000 SEC) ───
      const [isRunning, setIsRunning] = useState(false);
      const [elapsedSeconds, setElapsedSeconds] = useState(0);
      const [hasBenchmarkStarted, setHasBenchmarkStarted] = useState(false);
      const [testApproved, setTestApproved] = useState(false);
      const [recordedDuration, setRecordedDuration] = useState(null);

      const formatSecondsPadded = (sec) => {
        return String(sec).padStart(3, '0') + ' SEC';
      };

      const timerRef = useRef(null);
      useEffect(() => {
        if (isRunning) {
          timerRef.current = setInterval(() => {
            setElapsedSeconds(prev => prev + 1);
          }, 1000);
        } else if (timerRef.current) {
          clearInterval(timerRef.current);
        }
        return () => {
          if (timerRef.current) clearInterval(timerRef.current);
        };
      }, [isRunning]);

      // ─── 2. MULTI-ERROR SYSTEM (5 REAL BUGS) ───
      const [incidentErrors, setIncidentErrors] = useState(INITIAL_ERRORS);
      const [selectedErrorId, setSelectedErrorId] = useState('err-1');

      const unresolvedFaultCount = useMemo(() => {
        return incidentErrors.filter(e => !e.resolved).length;
      }, [incidentErrors]);

      const selectedError = useMemo(() => {
        return incidentErrors.find(e => e.id === selectedErrorId) || incidentErrors[0];
      }, [incidentErrors, selectedErrorId]);

      // ─── 3. ACTIVE VIEW NAVIGATION ───
      const [activeView, setActiveView] = useState('overview'); 
      const viewContainerRef = useRef(null);

      // ─── STEPWISE INCIDENT RUNBOOK (5 GUIDED PHASES) ───
      const [currentStep, setCurrentStep] = useState(1); // 1: Ingest, 2: Swarm, 3: Hotfix, 4: Safety, 5: Rollback

      // ─── UNIVERSAL APP ONBOARDING & SDK INTEGRATION HUB ───
      const [selectedSdkTab, setSelectedSdkTab] = useState('python'); // 'python', 'node', 'k8s', 'webhook'
      const [apiKeyCopied, setApiKeyCopied] = useState(false);
      const [testIngestStatus, setTestIngestStatus] = useState(null); // 'SENDING', 'SUCCESS', null
      const [testIngestResult, setTestIngestResult] = useState(null);
      const [testServiceName, setTestServiceName] = useState('billing-service');
      const [testErrorType, setTestErrorType] = useState('KeyError: customer_id');

      const handleCopyApiKey = () => {
        navigator.clipboard.writeText('sre_live_sec_7f9a882e3b1c90');
        setApiKeyCopied(true);
        setTimeout(() => setApiKeyCopied(false), 2000);
      };

      const handleSendTestTelemetry = async () => {
        setTestIngestStatus('SENDING');
        try {
          const res = await fetch('/api/v1/telemetry/ingest', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              service: testServiceName,
              error: testErrorType,
              line: 42,
              timestamp: new Date().toISOString()
            })
          });
          const data = await res.json();
          setTestIngestStatus('SUCCESS');
          setTestIngestResult(data);
          
          // Also append to live logs
          setSwarmLogs(prev => [
            { time: new Date().toISOString().substring(11, 23), agent: 'IngestWebhook', msg: `[EXTERNAL APP INGESTED] Incoming packet from '${testServiceName}' (${testErrorType}) verified!` },
            ...prev
          ]);
        } catch (e) {
          setTestIngestStatus('SUCCESS');
          setTestIngestResult({ status: 'SUCCESS', message: 'Simulated packet ingested (Local fallback mode)', fingerprint: 'ast_sig_local_98a' });
        }
      };

      useEffect(() => {
        if (viewContainerRef.current && window.gsap) {
          gsap.fromTo(viewContainerRef.current, 
            { opacity: 0, y: 12 }, 
            { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }
          );
        }
      }, [activeView]);

      // ─── 4. USER ROLE (RBAC) ───
      const [userRole, setUserRole] = useState('Approver (Incident Commander)');

      // ─── ENTERPRISE HYBRID SECURITY ARCHITECTURE STATE ───
      const [securityMode, setSecurityMode] = useState('HYBRID'); // 'HYBRID' | 'RESTRICTED'
      const [showApprovalModal, setShowApprovalModal] = useState(false);
      const [previewData, setPreviewData] = useState(null);
      const [isApproving, setIsApproving] = useState(false);
      const [securityNotice, setSecurityNotice] = useState(null);

      const fetchSecurityState = async () => {
        try {
          const res = await fetch('/api/security/mode');
          if (res.ok) {
            const data = await res.json();
            if (data.mode) setSecurityMode(data.mode);
          }
        } catch (e) {}

        try {
          const auditRes = await fetch('/api/security/audit-ledger');
          if (auditRes.ok) {
            const auditData = await auditRes.json();
            if (auditData.ledger && auditData.ledger.length > 0) {
              setAuditLedger(auditData.ledger);
            }
          }
        } catch (e) {}
      };

      useEffect(() => {
        fetchSecurityState();
      }, []);

      const handleToggleSecurityMode = async (e) => {
        const newMode = e.target.value;
        setSecurityMode(newMode);
        try {
          await fetch('/api/security/mode', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              mode: newMode,
              actor: 'SRE-Commander (Keshav Jadam)',
              role: userRole
            })
          });
          fetchSecurityState();
        } catch (err) {}
      };

      const triggerAiSwarmWithSecurityGate = async () => {
        if (securityMode === 'RESTRICTED') {
          setSecurityNotice('🔒 RESTRICTED MODE ACTIVE: External Gemini AI transmission blocked by enterprise policy. Running 100% on-premise AST heuristics.');
          handleRunSwarm(null);
          return;
        }

        try {
          const res = await fetch('/api/security/preview-payload', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              logs: selectedError.stack,
              gitDiff: selectedError.diff,
              incidentId: 'INC-2026-0814'
            })
          });
          const data = await res.json();
          setPreviewData(data);
          setShowApprovalModal(true);
        } catch (err) {
          handleRunSwarm(null);
        }
      };

      const handleApproveDataSharing = async () => {
        if (!previewData || !previewData.approvalToken) return;
        setIsApproving(true);
        try {
          await fetch('/api/security/approve-payload', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              approvalToken: previewData.approvalToken,
              approved: true,
              approverName: 'Keshav Jadam',
              justification: 'Production P0 Outage Triage Authorization'
            })
          });
          setShowApprovalModal(false);
          setIsApproving(false);
          handleRunSwarm(previewData.approvalToken);
          fetchSecurityState();
        } catch (err) {
          setShowApprovalModal(false);
          setIsApproving(false);
          handleRunSwarm(null);
        }
      };

      const handleRejectDataSharing = async () => {
        if (previewData && previewData.approvalToken) {
          try {
            await fetch('/api/security/approve-payload', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                approvalToken: previewData.approvalToken,
                approved: false,
                approverName: 'Keshav Jadam',
                justification: 'Explicitly rejected by Commander: Swarm halted'
              })
            });
          } catch (err) {}
        }
        setShowApprovalModal(false);
        setSecurityNotice('🛑 INVESTIGATION HALTED: Commander explicitly rejected AI data-sharing. Zero evidence was sent to Gemini. Process stopped.');
        setSwarmStatus('REJECTED');
        setSwarmProgress(0);
        setAgentWorkers(prev => prev.map(w => ({ ...w, status: 'BLOCKED', activeDetail: 'Execution blocked by Commander policy.' })));
        setSwarmLogs(prev => [
          { time: new Date().toISOString().substring(11, 23), agent: 'SecurityGateGuard', msg: '🛑 [REJECTED BY COMMANDER] AI data sharing rejected. External AI blocked. Swarm execution HALTED.' },
          ...prev
        ]);
        fetchSecurityState();
      };

      // ─── 5. INCIDENT LIFECYCLE ───
      const [incidentState, setIncidentState] = useState('INVESTIGATING');

      // Telemetry Data
      const [errorRate, setErrorRate] = useState(94.8);
